[monitor]
# port: auto albo np. /dev/ttyUSB0
device = auto

# cpu  = zajętość CPU w %
# load = loadavg z 1 min / liczba rdzeni, w %
# temp = najwyższa temperatura stref termicznych, w °C
metric = cpu

# co ile sekund mierzyć
interval = 2
# wygładzanie (1.0 = brak; 0.4 = reakcja w ~2-3 pomiary)
smoothing = 0.4

# progi między poziomami 0 | 1 | 2 | 3 (dla temp np. 60, 75, 85)
thresholds = 50, 75, 90
# zejście poziom niżej dopiero, gdy wartość spadnie o tyle poniżej progu
hysteresis = 5

# Stan LED dla poziomu:  tryb:jasność(1-5):prędkość(1-5)
# tryb: rainbow, breathing, cycle, off, auto albo numer (np. znaleziony przez 'mp100-led probe')
# Docelowo: zielony / żółty / pomarańczowy / czerwony.
level0 = cycle:1:1
level1 = breathing:3:2
level2 = breathing:5:4
level3 = rainbow:5:5

# stan po zatrzymaniu usługi (puste = nie zmieniaj)
on_exit = rainbow:3:3
# ponawiaj wysłanie stanu co N s (np. po restarcie kontrolera); 0 = wyłączone
refresh = 300
